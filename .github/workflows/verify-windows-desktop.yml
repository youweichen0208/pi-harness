# 独立 Windows/Linux 测试包：真实平台构建和 OMP 门禁，产物保存在 Actions。
# 不经 Release 工作流；所有包内检查通过后才上传安装包。
name: Verify desktop migration

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform for a checkout test package"
        type: choice
        options: [windows, linux]
        default: windows
      release_tag:
        description: "Existing release to diagnose (blank builds the checkout)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify:
    if: ${{ inputs.release_tag == '' && inputs.platform != 'linux' }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Python (setuptools for node-gyp)
        run: python3 -m pip install --upgrade setuptools

      - name: Check lockfile registry
        run: npm run check:lockfile

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and protocol boundary
        run: |
          node tests/check-engine-boundary-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Production boundary regression failed" }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw "Typecheck failed" }
          npm run check:protocol
          if ($LASTEXITCODE -ne 0) { throw "Protocol boundary failed" }

      - name: Build web + server
        run: npm run build

      # 先在普通 Node 下跑一遍终端冒烟测试：确认 node-pty 自带的
      # prebuilds/win32-x64/pty.node 在真机 Windows 上能正常 spawn/收发数据。
      # 终端失败需要直接阻断验证，不能用 continue-on-error 掩盖读写问题。
      - name: Terminal smoke test (plain Node)
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            Write-Host "Terminal smoke round $_/3"
            node tests/terminal-smoke-test.mjs
            if ($LASTEXITCODE -ne 0) { throw "Terminal smoke round $_ failed" }
          }

      # electron-builder 默认 npmRebuild: true，会用 @electron/rebuild + node-gyp
      # 把 node-pty 针对 Electron 的 Node ABI 重新编译一遍（这一步在 mac/Linux 上
      # 交叉构建时会直接报错，只有真机 Windows 才能跑；windows-latest runner 自带
      # 编译工具链，这里应该会成功）。产出 nsis 安装包 + portable 绿色版 + zip。
      - name: Verify OMP runtime, configuration and entry (plain Node)
        run: |
          node tests/omp-runtime-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-runtime-test.mjs failed" }
          node tests/omp-task-compaction-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-task-compaction-test.mjs failed" }
          node tests/omp-openai-proxy-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-openai-proxy-test.mjs failed" }
          node tests/omp-proxy-transports-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-proxy-transports-test.mjs failed" }
          node tests/omp-model-config-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-model-config-test.mjs failed" }
          node tests/omp-model-catalog-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-model-catalog-test.mjs failed" }
          node tests/omp-skill-settings-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-skill-settings-test.mjs failed" }
          node tests/omp-extension-settings-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-extension-settings-test.mjs failed" }
          node tests/omp-packages-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-packages-test.mjs failed" }
          node tests/omp-marketplace-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-marketplace-test.mjs failed" }
          node tests/omp-package-features-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-package-features-test.mjs failed" }
          node tests/omp-package-settings-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-package-settings-test.mjs failed" }
          node tests/omp-mcp-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-mcp-test.mjs failed" }
          node tests/omp-mcp-auth-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-mcp-auth-test.mjs failed" }
          node tests/omp-mcp-auth-reconnect-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-mcp-auth-reconnect-test.mjs failed" }
          node tests/omp-stop-metadata-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-stop-metadata-test.mjs failed" }
          node tests/omp-prompt-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-prompt-test.mjs failed" }
          node tests/omp-tasks-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-tasks-test.mjs failed" }
          node tests/omp-request-diagnostics-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-request-diagnostics-test.mjs failed" }
          node tests/omp-task-output-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-task-output-test.mjs failed" }
          node tests/omp-mcp-diagnostics-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-mcp-diagnostics-test.mjs failed" }
          node tests/reasoning-repetition-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "OMP reasoning interruption regression failed" }
          node tests/omp-recovery-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-recovery-test.mjs failed" }
          node tests/omp-restricted-recovery-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Restricted OMP recovery failed" }
          node tests/playground-drain-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Playground drain failed" }
          node tests/omp-persistence-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "OMP persistence failed" }
          node tests/omp-persistence-restart-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "OMP persistence restart failed" }
          node tests/omp-external-history-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-external-history-test failed" }
          node tests/omp-session-storage-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-session-storage-test failed" }
          node tests/omp-tree-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-tree-test.mjs failed" }
          node tests/omp-skill-history-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-skill-history-test.mjs failed" }
          node tests/omp-template-attachments-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-template-attachments-test.mjs failed" }
          node tests/omp-entry-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "omp-entry-test.mjs failed" }

      - name: Install browser for toolbar regression
        run: npx playwright-core install chromium

      - name: Verify desktop toolbar layout on Windows
        run: node tests/desktop-toolbar-test.mjs

      - name: Build Electron desktop app (real npmRebuild)
        run: npm run build:electron:win -- --publish never

      - name: Verify packaged server and portable relaunch
        shell: pwsh
        run: |
          node tests/packaged-jdbc-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "Packaged JDBC bridge failed" }
          node tests/packaged-server-start-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "Packaged server cannot start" }
          node tests/omp-runtime-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "Packaged OMP runtime failed" }
          node tests/omp-model-config-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "omp-model-config-test.mjs failed" }
          node tests/omp-model-catalog-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "omp-model-catalog-test.mjs failed" }
          node tests/omp-skill-settings-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "omp-skill-settings-test.mjs failed" }
          node tests/omp-extension-settings-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "omp-extension-settings-test.mjs failed" }
          node tests/omp-packages-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "omp-packages-test.mjs failed" }
          node tests/omp-marketplace-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "omp-marketplace-test.mjs failed" }
          node tests/omp-package-features-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "omp-package-features-test.mjs failed" }
          node tests/omp-package-settings-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "omp-package-settings-test.mjs failed" }
          node tests/omp-mcp-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "OMP MCP runtime failed" }
          node tests/omp-mcp-auth-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "OMP MCP OAuth failed" }
          node tests/omp-mcp-auth-reconnect-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "omp-mcp-auth-reconnect-test.mjs failed" }
          node tests/omp-stop-metadata-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "OMP stop metadata failed" }
          node tests/omp-prompt-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "OMP prompt files failed" }
          node tests/omp-tasks-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "Packaged OMP configuration failed" }
          node tests/omp-request-diagnostics-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "omp-request-diagnostics-test.mjs failed" }
          node tests/omp-task-output-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "omp-task-output-test.mjs failed" }
          node tests/omp-task-compaction-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "omp-task-compaction-test.mjs failed" }
          node tests/omp-mcp-diagnostics-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "omp-mcp-diagnostics-test.mjs failed" }
          node tests/reasoning-repetition-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "OMP reasoning interruption regression failed" }
          node tests/omp-recovery-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "Packaged OMP recovery failed" }
          node tests/omp-restricted-recovery-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "Restricted OMP recovery failed" }
          node tests/playground-drain-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "Playground drain failed" }
          node tests/omp-persistence-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "Packaged OMP persistence failed" }
          node tests/omp-persistence-restart-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "OMP persistence restart failed" }
          node tests/omp-external-history-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "omp-external-history-test failed" }
          node tests/omp-session-storage-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "omp-session-storage-test failed" }
          node tests/omp-skill-history-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "Packaged OMP skill history failed" }
          node tests/omp-template-attachments-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "Packaged OMP template attachments failed" }
          node tests/omp-entry-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "Packaged OMP entry failed" }
          $portable = Get-ChildItem release/*win-x64.exe | Select-Object -First 1
          ./tests/portable-relaunch-test.ps1 -PortableExe $portable.FullName

      - name: Verify packaged OMP resources and rendering
        shell: pwsh
        run: |
          node tests/windows-rendering-test.mjs release/win-unpacked/pi.exe
          if ($LASTEXITCODE -ne 0) { throw "Packaged rendering failed" }
          node tests/omp-resources-desktop-test.mjs release/win-unpacked/pi.exe
          if ($LASTEXITCODE -ne 0) { throw "omp-resources-desktop-test.mjs failed" }
          node tests/omp-packages-browser-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "Packaged OMP package settings UI failed" }
          node tests/omp-mcp-browser-test.mjs release/win-unpacked/pi.exe
          if ($LASTEXITCODE -ne 0) { throw "Packaged OMP resources failed" }
          node tests/omp-prompt-browser-test.mjs release/win-unpacked/pi.exe
          if ($LASTEXITCODE -ne 0) { throw "Packaged OMP prompt UI failed" }
          node tests/omp-tasks-browser-test.mjs release/win-unpacked/pi.exe
          if ($LASTEXITCODE -ne 0) { throw "Packaged OMP task UI failed" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omp-validation-rendering-windows
          path: |
            tests/scratch/rendering
            tests/scratch/omp-task-*.png
            tests/scratch/omp-skill-settings*.png
            tests/scratch/omp-extension-*.png
            tests/scratch/omp-mcp-*.png
            tests/scratch/omp-package-settings-*.png
            tests/scratch/omp-package-features-*.png
            tests/scratch/omp-packages-*.png
            tests/scratch/omp-prompt-*.png
          if-no-files-found: warn

      - name: Verify ZIP in a path with spaces and Chinese characters
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/*win-x64.zip | Select-Object -First 1
          if (-not $zip) { throw "Windows ZIP is missing" }
          $dest = Join-Path $env:RUNNER_TEMP 'OMP 测试/portable pi'
          Expand-Archive $zip.FullName $dest
          node tests/packaged-server-start-test.mjs "$dest/pi.exe" "$dest/resources/app"
          if ($LASTEXITCODE -ne 0) { throw "Extracted ZIP server failed" }
          node tests/omp-task-compaction-test.mjs "$dest/pi.exe" "$dest/resources/app"
          if ($LASTEXITCODE -ne 0) { throw "Extracted ZIP native Task failed" }

      - name: Verify NSIS installation and previous-version data
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $previous = Join-Path $env:RUNNER_TEMP 'pi-previous'
          $dest = Join-Path $env:LOCALAPPDATA 'Programs\pi-release-test'
          # Previous version = latest published release; the first release has none and skips the upgrade-data check.
          $prev = (gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          if ($prev) {
            gh release download $prev --pattern '*win-x64.zip' --dir $previous
            if ($LASTEXITCODE -ne 0) { throw 'Previous release download failed' }
            $zip = Get-ChildItem "$previous/*win-x64.zip" | Select-Object -First 1
            Expand-Archive $zip.FullName "$previous/app"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item "$previous/app/*" $dest -Recurse
            node tests/packaged-upgrade-test.mjs seed "$dest/pi.exe" "$dest/resources/app" "$env:RUNNER_TEMP/pi-upgrade-state"
            if ($LASTEXITCODE -ne 0) { throw 'Previous runtime seed failed' }
          }
          $installer = Get-ChildItem release/*setup-x64.exe | Select-Object -First 1
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', '/currentuser', "/D=$dest") -PassThru
          if (-not $proc.WaitForExit(180000) -or $proc.ExitCode -ne 0) { throw 'NSIS installation failed' }
          node tests/packaged-server-start-test.mjs "$dest/pi.exe" "$dest/resources/app"
          if ($LASTEXITCODE -ne 0) { throw 'Installed server failed' }
          if ($prev) {
            node tests/packaged-upgrade-test.mjs verify "$dest/pi.exe" "$dest/resources/app" "$env:RUNNER_TEMP/pi-upgrade-state"
            if ($LASTEXITCODE -ne 0) { throw 'Previous-version data failed' }
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: pi-harness-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 7

  diagnose-release:
    if: ${{ inputs.release_tag != '' }}
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download published Windows packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download $env:RELEASE_TAG --pattern '*win-x64.zip' --pattern '*setup-x64.exe' --dir "$env:RUNNER_TEMP/packages"
          if ($LASTEXITCODE -ne 0) { throw "Release download failed" }
      - name: Start published ZIP in a path with spaces and Chinese characters
        shell: pwsh
        run: |
          $zip = Get-ChildItem "$env:RUNNER_TEMP/packages/*win-x64.zip" | Select-Object -First 1
          $dest = "$env:RUNNER_TEMP/桌面测试/portable pi"
          Expand-Archive $zip.FullName $dest
          node tests/packaged-server-start-test.mjs "$dest/pi.exe" "$dest/resources/app"
          if ($LASTEXITCODE -ne 0) { throw "Published ZIP cannot start" }
      - name: Install NSIS and start installed server
        shell: pwsh
        run: |
          $installer = Get-ChildItem "$env:RUNNER_TEMP/packages/*setup-x64.exe" | Select-Object -First 1
          $dest = Join-Path $env:LOCALAPPDATA "Programs\pi-test"
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', '/currentuser', "/D=$dest") -PassThru
          if (-not $proc.WaitForExit(180000)) { throw "Installer did not exit within 180 seconds" }
          if ($proc.ExitCode -ne 0) { throw "Installer failed: $($proc.ExitCode)" }
          if (-not (Test-Path "$dest/pi.exe")) {
            $installed = Get-ChildItem "$env:LOCALAPPDATA/Programs" -Filter pi.exe -Recurse | Select-Object -First 1
            if (-not $installed) { throw "Installer exited without an installed pi.exe" }
            $dest = $installed.DirectoryName
          }
          Write-Host "Installed app: $dest"
          node tests/packaged-server-start-test.mjs "$dest/pi.exe" "$dest/resources/app"
          if ($LASTEXITCODE -ne 0) { throw "Installed server cannot start" }

  diagnose-portable:
    if: ${{ inputs.release_tag != '' }}
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download published portable EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download $env:RELEASE_TAG --pattern '*win-x64.exe' --dir "$env:RUNNER_TEMP/portable-package"
          if ($LASTEXITCODE -ne 0) { throw "Release download failed" }
      - name: Verify portable first launch and relaunch
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:RUNNER_TEMP/portable-package/*win-x64.exe" | Select-Object -First 1
          ./tests/portable-relaunch-test.ps1 -PortableExe $exe.FullName

  verify-linux:
    if: ${{ inputs.release_tag == '' && inputs.platform == 'linux' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install system deps (node-gyp)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-setuptools xvfb libgtk-3-0 libnss3 libgbm1 libasound2t64 libfuse2t64

      - name: Check lockfile registry
        run: npm run check:lockfile

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and protocol boundary
        run: |
          node tests/check-engine-boundary-test.mjs
          npm run typecheck
          npm run check:protocol

      - name: Build web + server
        run: npm run build

      - name: Verify OMP runtime, configuration and entry (plain Node)
        run: |
          node tests/terminal-smoke-test.mjs
          node tests/omp-runtime-test.mjs
          node tests/omp-task-compaction-test.mjs
          node tests/omp-openai-proxy-test.mjs
          node tests/omp-proxy-transports-test.mjs
          node tests/omp-model-config-test.mjs
          node tests/omp-model-catalog-test.mjs
          node tests/omp-skill-settings-test.mjs
          node tests/omp-extension-settings-test.mjs
          node tests/omp-packages-test.mjs
          node tests/omp-marketplace-test.mjs
          node tests/omp-package-features-test.mjs
          node tests/omp-package-settings-test.mjs
          node tests/omp-mcp-test.mjs
          node tests/omp-mcp-auth-test.mjs
          node tests/omp-mcp-auth-reconnect-test.mjs
          node tests/omp-stop-metadata-test.mjs
          node tests/omp-prompt-test.mjs
          node tests/omp-tasks-test.mjs
          node tests/omp-request-diagnostics-test.mjs
          node tests/omp-task-output-test.mjs
          node tests/omp-mcp-diagnostics-test.mjs
          node tests/reasoning-repetition-test.mjs
          node tests/omp-recovery-test.mjs
          node tests/omp-restricted-recovery-test.mjs
          node tests/playground-drain-test.mjs
          node tests/omp-persistence-test.mjs
          node tests/omp-persistence-restart-test.mjs
          node tests/omp-external-history-test.mjs
          node tests/omp-session-storage-test.mjs
          node tests/omp-tree-test.mjs
          node tests/omp-skill-history-test.mjs
          node tests/omp-template-attachments-test.mjs
          node tests/omp-entry-test.mjs

      - name: Build Electron (Linux)
        run: npx electron-builder build --linux --x64 --publish never

      - name: Verify packaged server and OMP integration
        run: |
          root="$PWD/release/linux-unpacked/resources/app"
          executable="$PWD/release/linux-unpacked/pi-harness"
          node tests/packaged-server-start-test.mjs "$executable" "$root"
          node tests/packaged-jdbc-test.mjs "$executable" "$root"
          node tests/omp-runtime-test.mjs "$executable" "$root"
          node tests/omp-model-config-test.mjs "$executable" "$root"
          node tests/omp-model-catalog-test.mjs "$executable" "$root"
          node tests/omp-skill-settings-test.mjs "$executable" "$root"
          node tests/omp-extension-settings-test.mjs "$executable" "$root"
          node tests/omp-packages-test.mjs "$executable" "$root"
          node tests/omp-marketplace-test.mjs "$executable" "$root"
          node tests/omp-package-features-test.mjs "$executable" "$root"
          node tests/omp-package-settings-test.mjs "$executable" "$root"
          node tests/omp-mcp-test.mjs "$executable" "$root"
          node tests/omp-mcp-auth-test.mjs "$executable" "$root"
          node tests/omp-mcp-auth-reconnect-test.mjs "$executable" "$root"
          node tests/omp-stop-metadata-test.mjs "$executable" "$root"
          node tests/omp-prompt-test.mjs "$executable" "$root"
          node tests/omp-tasks-test.mjs "$executable" "$root"
          node tests/omp-request-diagnostics-test.mjs "$executable" "$root"
          node tests/omp-task-output-test.mjs "$executable" "$root"
          node tests/omp-task-compaction-test.mjs "$executable" "$root"
          node tests/omp-mcp-diagnostics-test.mjs "$executable" "$root"
          node tests/reasoning-repetition-test.mjs "$executable" "$root"
          node tests/omp-recovery-test.mjs "$executable" "$root"
          node tests/omp-restricted-recovery-test.mjs "$executable" "$root"
          node tests/playground-drain-test.mjs "$executable" "$root"
          node tests/omp-persistence-test.mjs "$executable" "$root"
          node tests/omp-persistence-restart-test.mjs "$executable" "$root"
          node tests/omp-external-history-test.mjs "$executable" "$root"
          node tests/omp-session-storage-test.mjs "$executable" "$root"
          node tests/omp-skill-history-test.mjs "$executable" "$root"
          node tests/omp-template-attachments-test.mjs "$executable" "$root"
          node tests/omp-entry-test.mjs "$executable" "$root"

      - name: Verify packaged desktop UI
        run: |
          executable="$PWD/release/linux-unpacked/pi-harness"
          root="$PWD/release/linux-unpacked/resources/app"
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          xvfb-run -a -s '-screen 0 1920x1080x24' node tests/windows-rendering-test.mjs "$executable"
          xvfb-run -a -s '-screen 0 1920x1080x24' node tests/omp-resources-desktop-test.mjs "$executable"
          xvfb-run -a -s '-screen 0 1920x1080x24' node tests/omp-packages-browser-test.mjs "$executable" "$root"
          xvfb-run -a -s '-screen 0 1920x1080x24' node tests/omp-mcp-browser-test.mjs "$executable"
          xvfb-run -a -s '-screen 0 1920x1080x24' node tests/omp-prompt-browser-test.mjs "$executable"
          xvfb-run -a -s '-screen 0 1920x1080x24' node tests/omp-tasks-browser-test.mjs "$executable"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omp-validation-rendering-linux
          path: |
            tests/scratch/rendering
            tests/scratch/omp-*.png
          if-no-files-found: warn

      - name: Verify extracted AppImage in a path with spaces and Chinese characters
        run: |
          artifact=("$PWD"/release/*.AppImage)
          test "${#artifact[@]}" -eq 1
          mkdir -p "$RUNNER_TEMP/OMP 测试/AppImage"
          cd "$RUNNER_TEMP/OMP 测试/AppImage"
          "${artifact[0]}" --appimage-extract > "$RUNNER_TEMP/omp-appimage-extraction.log"
          root="$PWD/squashfs-root/resources/app"
          executable="$PWD/squashfs-root/pi-harness"
          cd "$GITHUB_WORKSPACE"
          node tests/packaged-server-start-test.mjs "$executable" "$root"
          node tests/omp-task-compaction-test.mjs "$executable" "$root"

      - name: Verify deb installation and previous-version data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous="$RUNNER_TEMP/pi-previous"
          mkdir -p "$previous"
          # Previous version = latest published release; the first release has none and skips the upgrade-data check.
          prev=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$prev" ]; then
            gh release download "$prev" --pattern '*.deb' --dir "$previous"
            dpkg-deb -x "$previous/"*.deb "$previous/app"
            oldroot=$(dirname "$(find "$previous/app" -path '*/resources/app/package.json' -print -quit)")
            # Linux builds name the executable pi-harness (3c7ddcc); older packages may still ship pi.
            oldexe="$oldroot/../../pi-harness"; [ -x "$oldexe" ] || oldexe="$oldroot/../../pi"
            node tests/packaged-upgrade-test.mjs seed "$oldexe" "$oldroot" "$RUNNER_TEMP/pi-upgrade-state"
          fi
          sudo apt-get update
          sudo apt-get install -y ./release/*.deb
          package=$(dpkg-deb -f release/*.deb Package)
          test "$package" = pi-harness
          test "$(dpkg-query -W -f='${Version}' "$package")" = "$(node -p "require('./package.json').version")"
          root=$(dirname "$(dpkg -L "$package" | sed -n '\|/resources/app/package.json$|p')")
          node tests/packaged-server-start-test.mjs "$root/../../pi-harness" "$root"
          if [ -n "$prev" ]; then node tests/packaged-upgrade-test.mjs verify "$root/../../pi-harness" "$root" "$RUNNER_TEMP/pi-upgrade-state"; fi

      - name: Checksum verified test packages
        run: |
          cd release
          sha256sum *.AppImage *.deb > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: omp-validation-linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
