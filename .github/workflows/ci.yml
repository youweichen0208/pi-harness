name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check lockfile registry
        run: npm run check:lockfile

      - name: Install dependencies
        run: npm ci

      # 协议双端手工同步校验（server/protocol.ts ↔ web/src/types.ts）
      - name: Check protocol sync
        run: node scripts/check-protocol-sync.mjs

      # 自起 server 的测试不得泄漏宿主 PI_* 环境（见 tests/lib/test-env.mjs）
      - name: Check test env isolation
        run: node scripts/check-test-env.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify real JDBC bridge
        run: node tests/packaged-jdbc-test.mjs

      # 设计令牌检查与纯函数单测（零 token）
      - name: Design tokens and unit tests
        run: npm test

      # 零 token 协议冒烟（每个测试自起隔离 server：独立端口 + 临时 data-dir）
      - name: Protocol smoke tests
        run: node tests/run-smoke.mjs

  node-workbench:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm run check:lockfile
      - run: npm ci
      - run: npm run build:server
      - run: node tests/packaged-jdbc-test.mjs
      - run: node tests/node-workbench-test.mjs

  desktop-rendering:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm run check:lockfile
      - run: npm ci
      - run: npm run build
      - run: node tests/packaged-jdbc-test.mjs
      - name: Desktop toolbar with expanded and collapsed sidebar
        run: |
          npx playwright-core install chromium
          node tests/desktop-toolbar-test.mjs
      - name: DataGrip JDBC interface (local fixtures only)
        run: node tests/database-jdbc-browser-test.mjs
      - name: Pi CLI detection and installation UI (no global installation)
        run: |
          npx vitest run tests/unit/pi-cli-status.test.ts
          node tests/pi-cli-setup-browser-test.mjs
      - name: SCM operations and worktrees (local Git only)
        run: |
          npx vitest run tests/unit/scm-operations.test.ts
          node tests/scm-operations-browser-test.mjs
      - run: npx electron-builder install-app-deps
      - name: Actual Electron typography and DPI regression
        run: node tests/windows-rendering-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-rendering-${{ matrix.os }}
          path: tests/scratch/rendering/
          if-no-files-found: error

  typography-parity:
    needs: desktop-rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-rendering-*
          merge-multiple: true
          path: tests/scratch/rendering/
      - run: node tests/compare-rendering-metrics.mjs
